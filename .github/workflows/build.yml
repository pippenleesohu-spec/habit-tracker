          # 12. HabitStorage.kt
          write_file("app/src/main/java/com/habit/plastictracker/HabitStorage.kt", """
          package com.habit.plastictracker

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          data class HabitItem(val id: String, val text: String)

          object HabitStorage {
              private const val PREF_NAME = "plastic_habit_prefs"
              private const val KEY_HABITS = "habits_json"
              private const val KEY_STATE = "daily_state_json"

              private val DEFAULT_HABITS = listOf(
                  "微习惯打卡项 AAA",
                  "微习惯打卡项 BBB",
                  "微习惯打卡项 CCC",
                  "微习惯打卡项 DDD",
                  "微习惯打卡项 EEE",
                  "微习惯打卡项 FFF",
                  "微习惯打卡项 GGG",
                  "微习惯打卡项 HHH",
                  "微习惯打卡项 III",
                  "微习惯打卡项 JJJ"
              )

              fun getTodayString(): String {
                  return SimpleDateFormat("yyyy-MM-dd", Locale.getDefault()).format(Date())
              }

              private fun getDefaultHabitsJson(): String {
                  val arr = JSONArray()
                  DEFAULT_HABITS.forEachIndexed { idx, text ->
                      val obj = JSONObject()
                      obj.put("id", "h_${idx + 1}")
                      obj.put("text", text)
                      arr.put(obj)
                  }
                  return arr.toString()
              }

              fun getHabitsJson(context: Context): String {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  var json = prefs.getString(KEY_HABITS, null)
                  if (json.isNullOrEmpty()) {
                      json = getDefaultHabitsJson()
                      prefs.edit().putString(KEY_HABITS, json).apply()
                  }
                  return json
              }

              fun setHabitsJson(context: Context, json: String) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putString(KEY_HABITS, json).commit()
              }

              fun getDailyStateJson(context: Context): String {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  val today = getTodayString()
                  val raw = prefs.getString(KEY_STATE, null)
                  if (!raw.isNullOrEmpty()) {
                      try {
                          val obj = JSONObject(raw)
                          if (obj.optString("date") == today) {
                              return raw
                          }
                      } catch (_: Exception) {}
                  }
                  val fresh = JSONObject().apply {
                      put("date", today)
                      put("completedIds", JSONArray())
                  }.toString()
                  prefs.edit().putString(KEY_STATE, fresh).commit()
                  return fresh
              }

              fun setDailyStateJson(context: Context, json: String) {
                  val prefs = context.getSharedPreferences(PREF_NAME, Context.MODE_PRIVATE)
                  prefs.edit().putString(KEY_STATE, json).commit()
              }

              fun getHabitsList(context: Context): List<HabitItem> {
                  val list = mutableListOf<HabitItem>()
                  try {
                      val arr = JSONArray(getHabitsJson(context))
                      for (i in 0 until arr.length()) {
                          val o = arr.getJSONObject(i)
                          list.add(HabitItem(o.getString("id"), o.getString("text")))
                      }
                  } catch (_: Exception) {}
                  return list
              }

              fun getCompletedIds(context: Context): MutableList<String> {
                  val list = mutableListOf<String>()
                  try {
                      val obj = JSONObject(getDailyStateJson(context))
                      val arr = obj.optJSONArray("completedIds") ?: JSONArray()
                      for (i in 0 until arr.length()) {
                          list.add(arr.getString(i))
                      }
                  } catch (_: Exception) {}
                  return list
              }

              fun completeHabit(context: Context, habitId: String) {
                  val completed = getCompletedIds(context)
                  if (!completed.contains(habitId)) {
                      completed.add(habitId)
                      val obj = JSONObject().apply {
                          put("date", getTodayString())
                          put("completedIds", JSONArray(completed))
                      }
                      setDailyStateJson(context, obj.toString())
                  }
              }

              fun resetToday(context: Context) {
                  val obj = JSONObject().apply {
                      put("date", getTodayString())
                      put("completedIds", JSONArray())
                  }
                  setDailyStateJson(context, obj.toString())
              }
          }
          """)

          # 13. HabitWidgetProvider.kt
          write_file("app/src/main/java/com/habit/plastictracker/HabitWidgetProvider.kt", """
          package com.habit.plastictracker

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.view.View
          import android.widget.RemoteViews

          class HabitWidgetProvider : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (appWidgetId in appWidgetIds) {
                      updateSingleWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      ACTION_COMPLETE_ITEM -> {
                          val habitId = intent.getStringExtra(EXTRA_HABIT_ID)
                          if (!habitId.isNullOrEmpty()) {
                              triggerHaptic(context)
                              HabitStorage.completeHabit(context, habitId)
                              notifyAllWidgetsAndApp(context)
                          }
                      }
                      ACTION_RESET_WIDGET -> {
                          triggerHaptic(context)
                          HabitStorage.resetToday(context)
                          notifyAllWidgetsAndApp(context)
                      }
                      ACTION_SYNC_WIDGET -> {
                          refreshAllWidgets(context)
                      }
                  }
              }

              companion object {
                  const val ACTION_COMPLETE_ITEM = "com.habit.plastictracker.ACTION_COMPLETE_ITEM"
                  const val ACTION_RESET_WIDGET = "com.habit.plastictracker.ACTION_RESET_WIDGET"
                  const val ACTION_SYNC_WIDGET = "com.habit.plastictracker.ACTION_SYNC_WIDGET"
                  const val ACTION_APP_SYNC = "com.habit.plastictracker.ACTION_APP_SYNC"
                  const val EXTRA_HABIT_ID = "extra_habit_id"

                  fun refreshAllWidgets(context: Context) {
                      val mgr = AppWidgetManager.getInstance(context)
                      val cn = ComponentName(context, HabitWidgetProvider::class.java)
                      val ids = mgr.getAppWidgetIds(cn)
                      if (ids.isNotEmpty()) {
                          mgr.notifyAppWidgetViewDataChanged(ids, R.id.widget_list_view)
                          for (id in ids) {
                              updateSingleWidget(context, mgr, id)
                          }
                      }
                  }

                  fun notifyAllWidgetsAndApp(context: Context) {
                      refreshAllWidgets(context)
                      val appIntent = Intent(ACTION_APP_SYNC).apply {
                          setPackage(context.packageName)
                      }
                      context.sendBroadcast(appIntent)
                  }

                  private fun triggerHaptic(context: Context) {
                      try {
                          val vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              val vm = context.getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                              vm.defaultVibrator
                          } else {
                              @Suppress("DEPRECATION")
                              context.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator.vibrate(VibrationEffect.createOneShot(35, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator.vibrate(35)
                          }
                      } catch (_: Exception) {}
                  }

                  fun updateSingleWidget(
                      context: Context,
                      appWidgetManager: AppWidgetManager,
                      appWidgetId: Int
                  ) {
                      val views = RemoteViews(context.packageName, R.layout.widget_habit_board)

                      val habits = HabitStorage.getHabitsList(context)
                      val completedSet = HabitStorage.getCompletedIds(context).toSet()
                      val validDoneCount = habits.count { completedSet.contains(it.id) }
                      val total = habits.size
                      val remain = (total - validDoneCount).coerceAtLeast(0)

                      views.setTextViewText(R.id.widget_progress, "剩余 $remain / $total")

                      if (remain == 0 && total > 0) {
                          views.setViewVisibility(R.id.widget_list_view, View.GONE)
                          views.setViewVisibility(R.id.widget_empty_view, View.VISIBLE)
                      } else {
                          views.setViewVisibility(R.id.widget_list_view, View.VISIBLE)
                          views.setViewVisibility(R.id.widget_empty_view, View.GONE)
                      }

                      val serviceIntent = Intent(context, HabitWidgetService::class.java).apply {
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, appWidgetId)
                          data = Uri.parse(toUri(Intent.URI_INTENT_SCHEME))
                      }
                      views.setRemoteAdapter(R.id.widget_list_view, serviceIntent)

                      val clickIntent = Intent(context, HabitWidgetProvider::class.java).apply {
                          action = ACTION_COMPLETE_ITEM
                      }
                      val clickPendingIntent = PendingIntent.getBroadcast(
                          context,
                          0,
                          clickIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                      )
                      views.setPendingIntentTemplate(R.id.widget_list_view, clickPendingIntent)

                      val resetIntent = Intent(context, HabitWidgetProvider::class.java).apply {
                          action = ACTION_RESET_WIDGET
                      }
                      val resetPendingIntent = PendingIntent.getBroadcast(
                          context,
                          1,
                          resetIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_btn_reset, resetPendingIntent)

                      val openAppIntent = Intent(context, MainActivity::class.java)
                      val openAppPendingIntent = PendingIntent.getActivity(
                          context,
                          2,
                          openAppIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widget_title, openAppPendingIntent)

                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }
              }
          }
          """)

