          write_file("app/src/main/java/com/habit/plastictracker/MainActivity.kt", """
          package com.habit.plastictracker

          import android.annotation.SuppressLint
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Color
          import android.os.Build
          import android.os.Bundle
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.os.VibratorManager
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.view.WindowInsetsControllerCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var webView: WebView

              private val widgetSyncReceiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      if (intent?.action == HabitWidgetProvider.ACTION_APP_SYNC) {
                          runOnUiThread {
                              webView.evaluateJavascript("if(window.__syncFromNative){window.__syncFromNative();}", null)
                          }
                      }
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      allowFileAccess = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      useWideViewPort = true
                      loadWithOverviewMode = true
                  }

                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          webView.evaluateJavascript("if(window.__syncFromNative){window.__syncFromNative();}", null)
                      }
                  }

                  webView.addJavascriptInterface(NativeBridge(), "AndroidBridge")
                  webView.loadUrl("file:///android_asset/index.html")

                  val filter = IntentFilter(HabitWidgetProvider.ACTION_APP_SYNC)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      registerReceiver(widgetSyncReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                  } else {
                      registerReceiver(widgetSyncReceiver, filter)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  HabitWidgetProvider.refreshAllWidgets(this)
                  webView.evaluateJavascript("if(window.__syncFromNative){window.__syncFromNative();}", null)
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(widgetSyncReceiver)
                  } catch (_: Exception) {}
                  super.onDestroy()
              }

              inner class NativeBridge {
                  @JavascriptInterface
                  fun getHabitsJson(): String {
                      return HabitStorage.getHabitsJson(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun saveHabitsJson(json: String) {
                      HabitStorage.setHabitsJson(this@MainActivity, json)
                      HabitWidgetProvider.refreshAllWidgets(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun getDailyStateJson(): String {
                      return HabitStorage.getDailyStateJson(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun saveDailyStateJson(json: String) {
                      HabitStorage.setDailyStateJson(this@MainActivity, json)
                      HabitWidgetProvider.refreshAllWidgets(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun getWeeklyHistoryJson(): String {
                      val prefs = getSharedPreferences("plastic_habit_prefs", Context.MODE_PRIVATE)
                      return prefs.getString("weekly_history_json", "{}") ?: "{}"
                  }

                  @JavascriptInterface
                  fun saveWeeklyHistoryJson(json: String) {
                      val prefs = getSharedPreferences("plastic_habit_prefs", Context.MODE_PRIVATE)
                      prefs.edit().putString("weekly_history_json", json).commit()
                  }

                  @JavascriptInterface
                  fun vibrate() {
                      try {
                          val vibrator = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                              val vm = getSystemService(Context.VIBRATOR_MANAGER_SERVICE) as VibratorManager
                              vm.defaultVibrator
                          } else {
                              @Suppress("DEPRECATION")
                              getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              vibrator.vibrate(VibrationEffect.createOneShot(35, VibrationEffect.DEFAULT_AMPLITUDE))
                          } else {
                              @Suppress("DEPRECATION")
                              vibrator.vibrate(35)
                          }
                      } catch (_: Exception) {}
                  }

                  @JavascriptInterface
                  fun setSystemBarsDark(isDark: Boolean) {
                      runOnUiThread {
                          val color = if (isDark) Color.parseColor("#1e1f22") else Color.parseColor("#e7e6e1")
                          window.statusBarColor = color
                          window.navigationBarColor = color
                          val controller = WindowInsetsControllerCompat(window, window.decorView)
                          controller.isAppearanceLightStatusBars = !isDark
                          controller.isAppearanceLightNavigationBars = !isDark
                      }
                  }
              }
          }
          """)

