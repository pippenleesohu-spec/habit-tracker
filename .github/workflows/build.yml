name: Build Daily Habit Tracker APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK licenses & ensure required SDK components
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager --licenses
          $ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager --update
          $ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Android Project Structure & Source Code
        run: |
          python3 - << 'EOF'
          import os

          def write_file(path, content):
              parent = os.path.dirname(path)
              if parent:
                  os.makedirs(parent, exist_ok=True)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content.lstrip('\n'))

          # 1. settings.gradle.kts
          write_file("settings.gradle.kts", """
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PlasticHabitTracker"
          include(":app")
          """)

          # 2. build.gradle.kts (Root)
          write_file("build.gradle.kts", """
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          """)

          # 3. gradle.properties
          write_file("gradle.properties", """
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          """)

          # 4. app/build.gradle.kts
          write_file("app/build.gradle.kts", """
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.habit.plastictracker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.habit.plastictracker"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.webkit:webkit:1.10.0")
          }
          """)

          # proguard‑rules.pro 新增，WebView @JavascriptInterface 必须保留
          write_file("app/proguard-rules.pro", """
          # Proguard rules for habit tracker
          -keepclassmembers class ** {
              @android.webkit.JavascriptInterface <methods>;
          }
          -dontwarn **
          """)

          # 5. AndroidManifest.xml 移除 usesCleartextTraffic
          write_file("app/src/main/AndroidManifest.xml", """
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.VIBRATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_plastic"
                  android:label="每日微习惯打卡器"
                  android:roundIcon="@drawable/ic_launcher_plastic"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.PlasticTracker">

                  <activity
                      android:name=".MainActivity"
