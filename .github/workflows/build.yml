          write_file("app/src/main/java/com/habit/plastictracker/HabitWidgetService.kt", """
          package com.habit.plastictracker

          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import android.widget.RemoteViewsService

          class HabitWidgetService : RemoteViewsService() {
              override fun onGetViewFactory(intent: Intent): RemoteViewsFactory {
                  return HabitRemoteViewsFactory(applicationContext)
              }
          }

          class HabitRemoteViewsFactory(private val context: Context) : RemoteViewsService.RemoteViewsFactory {

              private data class PendingEntry(val originalIndex: Int, val item: HabitItem)
              private var pendingList: List<PendingEntry> = emptyList()

              override fun onCreate() {
                  loadData()
              }

              override fun onDataSetChanged() {
                  loadData()
              }

              private fun loadData() {
                  val allHabits = HabitStorage.getHabitsList(context)
                  val completedSet = HabitStorage.getCompletedIds(context).toSet()
                  pendingList = allHabits.mapIndexedNotNull { idx, habit ->
                      if (!completedSet.contains(habit.id)) {
                          PendingEntry(idx + 1, habit)
                      } else {
                          null
                      }
                  }
              }

              override fun onDestroy() {
                  pendingList = emptyList()
              }

              override fun getCount(): Int = pendingList.size

              override fun getViewAt(position: Int): RemoteViews {
                  if (position < 0 || position >= pendingList.size) {
                      return RemoteViews(context.packageName, R.layout.widget_habit_item)
                  }
                  val entry = pendingList[position]
                  val views = RemoteViews(context.packageName, R.layout.widget_habit_item)
                  views.setTextViewText(R.id.widget_item_index, entry.originalIndex.toString())
                  views.setTextViewText(R.id.widget_item_text, entry.item.text)

                  val fillInIntent = Intent().apply {
                      putExtra(HabitWidgetProvider.EXTRA_HABIT_ID, entry.item.id)
                  }
                  views.setOnClickFillInIntent(R.id.widget_item_container, fillInIntent)
                  return views
              }

              override fun getLoadingView(): RemoteViews? = null
              override fun getViewTypeCount(): Int = 1
              override fun getItemId(position: Int): Long = pendingList[position].item.id.hashCode().toLong()
              override fun hasStableIds(): Boolean = true
          }
          """)

